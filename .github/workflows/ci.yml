name: CI/CD

on:
  push:
    branches: ["main", "newFrontend"]
  pull_request:
    branches: ["main", "newFrontend"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend - smoke and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ../shared_core
          pip install ruff==0.6.9

      # Informative only for now: the tree still carries pre-existing findings
      # (F401 unused imports, F601 repeated dict keys). Promote to blocking once
      # the backlog is cleared.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: ruff check app

      - name: Byte-compile application
        run: python -m compileall -q app

      - name: Import smoke test (no database required)
        run: python -c "import app.main; print('imported', len(app.main.app.routes), 'routes')"

      - name: Unit tests (pure logic)
        run: python -m pytest -q

  frontend:
    name: Frontend - type-check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci when the lockfile is in sync, otherwise fall back to install.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Type-check
        run: npm run type-check

      # Informative only for now; lint is intentionally excluded from the build
      # via eslint.ignoreDuringBuilds in next.config.js.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker - build and publish
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; ${VAR,,} lowercases in bash.
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Publish only on green pushes to the default branch; PRs just build.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          # backend/Dockerfile copies from the repository root
          # (backend/requirements.txt, shared_core/, …) — same context compose uses.
          context: .
          dockerfile: backend/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Docker metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
