# =============================================================================
# GlobeLens AI — Docker Compose Configuration
# Version: 2.0 | Local Development Environment
# =============================================================================
# Services:
#   backend   — FastAPI application (port 8000) with hot-reload
#   frontend  — Next.js web client placeholder (port 3000)
#   worker    — Celery worker for background jobs (newsletter dispatch)
#   beat      — Celery beat scheduler (daily/weekly digest)
#   mailpit   — Local SMTP catcher (SMTP 1025, web UI 8025)
#   db        — PostgreSQL 16 + pgvector extension (port 5432)
#   cache     — Redis Stack (port 6379)
#   search    — Elasticsearch 8.x single-node (port 9200)
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Named Volumes — persistent data across container restarts
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  # Generated illustrations: written by the worker, served by the API, so both
  # must see the same directory.
  media:
    driver: local
  # Threat Lens model artifact: trained once, read by backend + threat worker.
  # Docker seeds a fresh volume from the image's /app/models (the TTS model),
  # and the trained threat_lens.joblib is copied over at provisioning time.
  model_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks — isolated internal network for inter-service communication
# ---------------------------------------------------------------------------
networks:
  globelens_net:
    driver: bridge
    name: globelens_network

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 + pgvector — Primary relational + vector database
  # ─────────────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: globelens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globelens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-globelens_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script auto-creates the pgvector extension on first startup
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - globelens_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globelens} -d ${POSTGRES_DB:-globelens_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────
  # Redis Stack — CacheService + Pub/Sub for NotificationService
  # ─────────────────────────────────────────────────────────────────────────
  cache:
    image: redis/redis-stack:latest
    container_name: globelens_cache
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-redis_secret} --save 60 1 --loglevel warning"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
      # Redis Insight web UI (optional convenience tool)
      - "8001:8001"
    networks:
      - globelens_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # Elasticsearch 8.x — SearchService / SearchRepository
  # ─────────────────────────────────────────────────────────────────────────
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: globelens_search
    restart: unless-stopped
    environment:
      # Single-node mode — no cluster bootstrap required
      - discovery.type=single-node
      # Disable X-Pack security for frictionless local development
      - xpack.security.enabled=false
      # Cap JVM heap to prevent OOM kills on dev machines
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=globelens-cluster
      - node.name=globelens-node-01
      # Disable ML for reduced memory footprint
      - xpack.ml.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    networks:
      - globelens_net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # Mailpit — Local SMTP catcher + web UI (development email sink)
  # ─────────────────────────────────────────────────────────────────────────
  # Every message the backend sends in dev lands here instead of a real inbox.
  # Inspect it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: globelens_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI / REST API
    networks:
      - globelens_net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # FastAPI Backend — Core application layer
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    # Published by CI/CD on green pushes to main. On a deploy host, pin the
    # exact build with IMAGE_TAG=sha-<commit> and run `docker compose pull`.
    # Local development keeps using `build` via `docker compose up --build`.
    image: ghcr.io/benmouh10/globelens_ai-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development          # Uses the dev stage for hot-reload
    container_name: globelens_backend
    restart: unless-stopped
    # Mount source code for hot-reload (uvicorn --reload watches this)
    volumes:
      - ./backend/app:/app/app:delegated
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
      # Host-visible logs so long one-off enrichment runs survive
      # `docker compose run --rm`, which otherwise deletes the log with
      # the container.
      - ./backend/logs:/app/logs
      # Tests live outside app/; mounting them keeps the suite running on the
      # container's dependencies instead of the host's Python.
      - ./backend/tests:/app/tests
      - media:/app/media
      # Trained Threat Lens artifact + TTS model (the volume is seeded from the
      # image's /app/models on first use).
      - model_data:/app/models
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # ── Application ──
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-super_secret_dev_key_change_in_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALGORITHM: ${ALGORITHM:-HS256}

      # ── PostgreSQL (pgvector) ──
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-globelens}:${POSTGRES_PASSWORD:-globelens_secret}@db:5432/${POSTGRES_DB:-globelens_db}

      # ── Redis Cache ──
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@cache:6379/0

      # ── Elasticsearch ──
      ELASTICSEARCH_URL: http://search:9200
      ELASTICSEARCH_INDEX_EVENTS: ${ELASTICSEARCH_INDEX_EVENTS:-globelens_events}

      # ── LLM Provider (Ollama / Anthropic Claude / OpenAI / Gemini / Grok / Nvidia / Azure) ──
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      AZURE_EMBEDDING_API_KEY: ${AZURE_EMBEDDING_API_KEY:-}
      AZURE_EMBEDDING_ENDPOINT: ${AZURE_EMBEDDING_ENDPOINT:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      POLLINATIONS_API_URL: ${POLLINATIONS_API_URL:-https://gen.pollinations.ai/v1}
      NVIDIA_API_URL: ${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_LLM_MODEL: ${NVIDIA_LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # ── Ollama (local inference) ──
      # host.docker.internal routes to the Windows host from inside the container.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5-coder:14b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}

      # ── Embedding Model ──
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Must match the pgvector column width on embeddings.vector
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}

      # ── Text-to-Speech (article and event narration) ──
      # "local" runs Kokoro on CPU inside the image: no API key, no per-minute
      # billing. Set TTS_PROVIDER=openai|grok|gemini (plus that vendor's key) to
      # upgrade to a hosted voice.
      TTS_PROVIDER: ${TTS_PROVIDER:-local}
      TTS_MODEL: ${TTS_MODEL:-gpt-4o-mini-tts}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      TTS_LOCAL_VOICE: ${TTS_LOCAL_VOICE:-af_heart}
      TTS_LOCAL_MP3_QUALITY: ${TTS_LOCAL_MP3_QUALITY:-7}
      TTS_LOCAL_TARGET_RMS_DBFS: ${TTS_LOCAL_TARGET_RMS_DBFS:--20}
      TTS_LOCAL_PEAK_DBFS: ${TTS_LOCAL_PEAK_DBFS:--1}
      # ONNX Runtime would otherwise take one thread per CPU core and saturate the
      # host during a single narration request. 0 restores the library default.
      TTS_ONNX_THREADS: ${TTS_ONNX_THREADS:-4}
      TTS_MAX_CONCURRENT_SYNTHESIS: ${TTS_MAX_CONCURRENT_SYNTHESIS:-1}
      TTS_PREWARM_ENABLED: ${TTS_PREWARM_ENABLED:-true}
      TTS_PREWARM_STARTUP_DELAY_SECONDS: ${TTS_PREWARM_STARTUP_DELAY_SECONDS:-60}
      TTS_PREWARM_INTERVAL_SECONDS: ${TTS_PREWARM_INTERVAL_SECONDS:-900}
      TTS_PREWARM_BATCH: ${TTS_PREWARM_BATCH:-3}
      TTS_PREWARM_ITEM_DELAY_SECONDS: ${TTS_PREWARM_ITEM_DELAY_SECONDS:-2}
      TTS_PREWARM_MAX_CHARS: ${TTS_PREWARM_MAX_CHARS:-6000}
      TTS_SPEED: ${TTS_SPEED:-1.0}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-20000}
      TTS_CHUNK_CHARS: ${TTS_CHUNK_CHARS:-3500}
      TTS_STREAM_FIRST_CHUNK_CHARS: ${TTS_STREAM_FIRST_CHUNK_CHARS:-150}
      TTS_STREAM_CHUNK_CHARS: ${TTS_STREAM_CHUNK_CHARS:-300}
      AUDIO_URL_TTL_SECONDS: ${AUDIO_URL_TTL_SECONDS:-600}
      TTS_CACHE_TTL_SECONDS: ${TTS_CACHE_TTL_SECONDS:-604800}

      # ── CORS ──
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # ── Rate limiting (Redis-backed) ──
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
      RATE_LIMIT_GUEST: ${RATE_LIMIT_GUEST:-30/minute}
      # Only enable behind a trusted proxy that sets X-Forwarded-For.
      RATE_LIMIT_TRUST_FORWARDED: ${RATE_LIMIT_TRUST_FORWARDED:-false}

      # ── Threat Lens (windowed abusive-traffic blocking; S5 sprint 1) ──
      # Model is the volume-mounted threat_lens.joblib; the worker is a
      # dedicated container ("threat" service) so request scoring never starves
      # the main queue. Baked defaults match config.py; these may be overridden
      # via .env. Turn the middleware on with THREAT_LENS_ENABLED=true only
      # after the artifact exists in the model_data volume.
      THREAT_LENS_ENABLED: ${THREAT_LENS_ENABLED:-false}
      THREAT_LENS_QUEUE: ${THREAT_LENS_QUEUE:-threat}
      THREAT_LENS_TASK: ${THREAT_LENS_TASK:-app.worker.threat_tasks.analyze_telemetry_task}
      THREAT_LENS_MODEL_PATH: ${THREAT_LENS_MODEL_PATH:-/app/models/threat_lens.joblib}
      THREAT_LENS_RISK_THRESHOLD: ${THREAT_LENS_RISK_THRESHOLD:-0.90}
      THREAT_LENS_BLOCK_TTL_SECONDS: ${THREAT_LENS_BLOCK_TTL_SECONDS:-3600}
      THREAT_LENS_WINDOW_MIN_ANOMALIES: ${THREAT_LENS_WINDOW_MIN_ANOMALIES:-2}
      THREAT_LENS_WINDOW_SIZE: ${THREAT_LENS_WINDOW_SIZE:-5}
      THREAT_LENS_RATE_WINDOW_SECONDS: ${THREAT_LENS_RATE_WINDOW_SECONDS:-60}

      # ── Security response headers (HSTS auto-enabled when APP_ENV=production) ──
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}

      # ── Email / Newsletter (SMTP) ──
      # Dev default points at the Mailpit catcher. Override SMTP_* for prod.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-newsletter@globelens.ai}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GlobeLens AI}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      NEWSLETTER_DAILY_TOP_N: ${NEWSLETTER_DAILY_TOP_N:-5}
      NEWSLETTER_WEEKLY_TOP_N: ${NEWSLETTER_WEEKLY_TOP_N:-8}
      NEWSLETTER_DAILY_HOUR_UTC: ${NEWSLETTER_DAILY_HOUR_UTC:-7}
      NEWSLETTER_WEEKLY_DAY: ${NEWSLETTER_WEEKLY_DAY:-monday}
      NEWSLETTER_WEEKLY_HOUR_UTC: ${NEWSLETTER_WEEKLY_HOUR_UTC:-8}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}

      # ── Web Push (VAPID) ──
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@globelens.ai}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-3600}
      PUSH_DAILY_BRIEFING_HOUR_UTC: ${PUSH_DAILY_BRIEFING_HOUR_UTC:-8}
      # ── Illustrations (generated event artwork) ──
      # Billed per image, so this stays off until it is asked for. The worker
      # needs the same values as the API to produce a matching file.
      ILLUSTRATION_ENABLED: ${ILLUSTRATION_ENABLED:-false}
      ILLUSTRATION_PROVIDER: ${ILLUSTRATION_PROVIDER:-local}
      # Self-hosted endpoint, used when ILLUSTRATION_PROVIDER=local. Point this
      # at a GPU box once the model lives somewhere other than this host.
      ILLUSTRATION_LOCAL_BASE_URL: ${ILLUSTRATION_LOCAL_BASE_URL:-http://host.docker.internal:8001/v1}
      ILLUSTRATION_MODEL: ${ILLUSTRATION_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      ILLUSTRATION_SIZE: ${ILLUSTRATION_SIZE:-1024x1024}
      ILLUSTRATION_BATCH_LIMIT: ${ILLUSTRATION_BATCH_LIMIT:-20}
      ILLUSTRATION_MIN_IMPORTANCE: ${ILLUSTRATION_MIN_IMPORTANCE:-5.0}
      # The API serves these files from the same volume the worker writes.
      ILLUSTRATION_STORAGE_DIR: ${ILLUSTRATION_STORAGE_DIR:-/app/media/illustrations}
      ILLUSTRATION_URL_PREFIX: ${ILLUSTRATION_URL_PREFIX:-/media/illustrations}
    networks:
      - globelens_net
    # Backend only starts after all infrastructure services are healthy
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      search:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # Next.js Frontend Placeholder — Web Client (port 3000)
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/benmouh10/globelens_ai-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development          # Uses the dev stage with hot-reload
    container_name: globelens_frontend
    restart: unless-stopped
    volumes:
      # Mount src for hot-reload; node_modules is kept in container
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      # next.config.js drives the /api rewrite; mount it so proxy changes
      # (e.g. INTERNAL_API_URL) apply without an image rebuild.
      - ./frontend/next.config.js:/app/next.config.js:delegated
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      # Browser-facing base URL (reached by the user's browser)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side rewrite target (reached over the Docker network)
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_APP_NAME: GlobeLens AI
      WATCHPACK_POLLING: "true"    # Required for hot-reload inside Docker on Windows
    networks:
      - globelens_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────────────
  # Celery Worker — executes background tasks (newsletter dispatch, etc.)
  # ─────────────────────────────────────────────────────────────────────────
  worker:
    # Same published backend image as `backend`; only the command differs.
    image: ghcr.io/benmouh10/globelens_ai-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: globelens_worker
    restart: unless-stopped
    # Stay on the default queue: the Threat Lens scoring worker runs in its own
    # "threat" container, and -Q celery keeps this one from stealing those jobs.
    command: celery -A app.worker.celery_app.celery_app worker -Q celery --loglevel=info
    volumes:
      - ./backend/app:/app/app:delegated
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
      - ./backend/logs:/app/logs
      - media:/app/media
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-super_secret_dev_key_change_in_production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-globelens}:${POSTGRES_PASSWORD:-globelens_secret}@db:5432/${POSTGRES_DB:-globelens_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@cache:6379/0
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-newsletter@globelens.ai}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GlobeLens AI}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5-coder:14b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      POLLINATIONS_API_URL: ${POLLINATIONS_API_URL:-https://gen.pollinations.ai/v1}
      NVIDIA_API_URL: ${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@globelens.ai}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-3600}
      # ── Illustrations (generated event artwork) ──
      # Billed per image, so this stays off until it is asked for. The worker
      # needs the same values as the API to produce a matching file.
      ILLUSTRATION_ENABLED: ${ILLUSTRATION_ENABLED:-false}
      ILLUSTRATION_PROVIDER: ${ILLUSTRATION_PROVIDER:-local}
      # Self-hosted endpoint, used when ILLUSTRATION_PROVIDER=local. Point this
      # at a GPU box once the model lives somewhere other than this host.
      ILLUSTRATION_LOCAL_BASE_URL: ${ILLUSTRATION_LOCAL_BASE_URL:-http://host.docker.internal:8001/v1}
      ILLUSTRATION_MODEL: ${ILLUSTRATION_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      ILLUSTRATION_SIZE: ${ILLUSTRATION_SIZE:-1024x1024}
      ILLUSTRATION_BATCH_LIMIT: ${ILLUSTRATION_BATCH_LIMIT:-20}
      ILLUSTRATION_MIN_IMPORTANCE: ${ILLUSTRATION_MIN_IMPORTANCE:-5.0}
    networks:
      - globelens_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      disable: true

  # ─────────────────────────────────────────────────────────────────────────
  # Threat Lens Worker — dedicated scoring for the "threat" queue
  # ─────────────────────────────────────────────────────────────────────────
  # Consumes request telemetry, scores it against the volume-mounted model, and
  # enforces the windowed block (403 + blocked_ips row). Also hosts the internal
  # /score debug API on :9000 as a sidecar. Runs on --autoscale (4,1): the
  # lightweight equivalent of a KEDA autoscaler per the S5 architecture.
  threat:
    image: ghcr.io/benmouh10/globelens_ai-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: globelens_threat
    restart: unless-stopped
    entrypoint: ["sh", "/app/scripts/threat_entry.sh"]
    volumes:
      - ./backend/app:/app/app:delegated
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
      - ./backend/logs:/app/logs
      # Trained model artifact, shared with the API (already seeded with TTS).
      - model_data:/app/models
    ports:
      - "${THREAT_SCORE_PORT:-9000}:9000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-super_secret_dev_key_change_in_production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-globelens}:${POSTGRES_PASSWORD:-globelens_secret}@db:5432/${POSTGRES_DB:-globelens_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@cache:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      THREAT_LENS_ENABLED: ${THREAT_LENS_ENABLED:-false}
      THREAT_LENS_QUEUE: ${THREAT_LENS_QUEUE:-threat}
      THREAT_LENS_TASK: ${THREAT_LENS_TASK:-app.worker.threat_tasks.analyze_telemetry_task}
      THREAT_LENS_MODEL_PATH: ${THREAT_LENS_MODEL_PATH:-/app/models/threat_lens.joblib}
      THREAT_LENS_RISK_THRESHOLD: ${THREAT_LENS_RISK_THRESHOLD:-0.90}
      THREAT_LENS_BLOCKLIST_KEY_PREFIX: ${THREAT_LENS_BLOCKLIST_KEY_PREFIX:-threat:blocked}
      THREAT_LENS_BLOCKS_FEED_KEY: ${THREAT_LENS_BLOCKS_FEED_KEY:-threat:blocks}
      THREAT_LENS_BLOCK_TTL_SECONDS: ${THREAT_LENS_BLOCK_TTL_SECONDS:-3600}
      THREAT_LENS_WINDOW_MIN_ANOMALIES: ${THREAT_LENS_WINDOW_MIN_ANOMALIES:-2}
      THREAT_LENS_WINDOW_SIZE: ${THREAT_LENS_WINDOW_SIZE:-5}
      THREAT_LENS_RATE_WINDOW_SECONDS: ${THREAT_LENS_RATE_WINDOW_SECONDS:-60}
    networks:
      - globelens_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────
  # Celery Beat — scheduler that emits digest tasks on the configured cadence
  # ─────────────────────────────────────────────────────────────────────────
  beat:
    image: ghcr.io/benmouh10/globelens_ai-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: globelens_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./backend/app:/app/app:delegated
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
      - ./backend/logs:/app/logs
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-super_secret_dev_key_change_in_production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-globelens}:${POSTGRES_PASSWORD:-globelens_secret}@db:5432/${POSTGRES_DB:-globelens_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@cache:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      # Cadence — beat reads these to build its schedule
      NEWSLETTER_DAILY_HOUR_UTC: ${NEWSLETTER_DAILY_HOUR_UTC:-7}
      NEWSLETTER_WEEKLY_DAY: ${NEWSLETTER_WEEKLY_DAY:-monday}
      NEWSLETTER_WEEKLY_HOUR_UTC: ${NEWSLETTER_WEEKLY_HOUR_UTC:-8}
      PUSH_DAILY_BRIEFING_HOUR_UTC: ${PUSH_DAILY_BRIEFING_HOUR_UTC:-8}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@globelens.ai}
      PUSH_TTL_SECONDS: ${PUSH_TTL_SECONDS:-3600}
    networks:
      - globelens_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      disable: true

