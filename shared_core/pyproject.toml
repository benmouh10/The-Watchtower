[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-core"
version = "0.1.0"
description = "The Watchtower Threat Lens — telemetry schema, feature engineering, IsolationForest model and training traffic. Single source of truth shared by the FastAPI gateway (producer side) and the scoring worker (consumer side) so train and serve never skew."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.scripts]
threat-lens-train = "shared_core.training:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_core*"]