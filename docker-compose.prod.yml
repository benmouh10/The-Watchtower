# =============================================================================
# GlobeLens AI — Production overrides
# =============================================================================
# Layered on top of docker-compose.yml to run the published, production-target
# images instead of the local development ones.
#
# Usage (on a server with Docker Compose v2.24+):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pin a specific build for rollback safety (tags published by CI/CD as sha-<commit>):
#   IMAGE_TAG=sha-8338c50 docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   IMAGE_TAG=sha-8338c50 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What changes vs. the base (dev) file:
#   * build.target -> production for the four app services
#   * dev bind mounts removed (`!reset`); production code is baked into the image
#   * APP_ENV / NODE_ENV forced to production
#
# `volumes: !reset []` clears every inherited mount, including the named `media`
# volume — and that one is not a dev convenience. The worker writes generated
# illustrations to ILLUSTRATION_STORAGE_DIR (/app/media/illustrations) and the
# backend serves them back over /media/*, so dropping it would leave every image
# on the container's writable layer, gone at the next `up`. It is re-added below
# for the two services that touch it; alembic.ini and alembic/ are baked into
# the image already, and logs are deliberately left to the container in
# production.
#
# Requires Compose v2.24+ for the `!reset` tag (it clears values inherited
# from the base file instead of appending to them).
# =============================================================================

services:
  backend:
    build:
      target: production
    # !override replaces the whole inherited mount list rather than appending to
    # it, so the dev bind mounts stay gone and only this one survives.
    volumes: !override
      - media:/app/media
    environment:
      APP_ENV: production

  frontend:
    build:
      target: production
    volumes: !reset []
    environment:
      NODE_ENV: production

  worker:
    build:
      target: production
    # The worker is what writes the illustrations; without this mount they land
    # on the container layer and vanish on redeploy.
    volumes: !override
      - media:/app/media
    environment:
      APP_ENV: production

  beat:
    build:
      target: production
    volumes: !reset []
    environment:
      APP_ENV: production
